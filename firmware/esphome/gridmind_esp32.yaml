# ==============================================================================
# ESPHome Configuration for ESP32 GridMind & JARVIS IoT Matrix
# Zero-Code REST API & Web Server over Local Tailscale/WiFi LAN
# ==============================================================================

esphome:
  name: gridmind-esp32
  friendly_name: "GridMind Microgrid Actuator"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Local WiFi Configuration
wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "GridMind-Fallback-AP"
    password: "jarvisfallback"

captive_portal:

# Built-in Local REST API & Web Server
web_server:
  port: 80

api:
  encryption:
    key: "!secret api_key"

ota:
  - platform: esphome

# 4-Channel Physical Relay Switches
switch:
  - platform: gpio
    name: "Sector 1: Solar Inverter"
    id: relay_1
    pin:
      number: GPIO25
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Sector 2: Battery Storage"
    id: relay_2
    pin:
      number: GPIO26
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Sector 3: Main Grid Feed"
    id: relay_3
    pin:
      number: GPIO27
      inverted: true
    restore_mode: ALWAYS_ON

  - platform: gpio
    name: "Sector 4: Hospital Critical Load"
    id: relay_4
    pin:
      number: GPIO14
      inverted: true
    restore_mode: ALWAYS_ON

# Analog Voltage / Current Telemetry
sensor:
  - platform: adc
    pin: GPIO34
    name: "Grid Load Current (ACS712)"
    update_interval: 1s
    unit_of_measurement: "A"
    accuracy_decimals: 2
    filters:
      - offset: -1.65
      - multiply: 5.405 # (1 / 0.185V/A)
