[project]
name = "project-jarvis-x"
version = "1.4.0"
description = "Jarvis X v1.4.0 Production Autonomous Personal OS with Always-On Sovereign Daemon, Low-Latency IPC Gateway & Event Nervous System."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "pyzmq>=25.1.2"
]

[project.optional-dependencies]
voice = [
    "pyaudio>=0.2.14",
    "SpeechRecognition>=3.10.1",
    "faster-whisper>=1.0.0",
    "openwakeword>=0.6.0",
    "piper-tts>=1.2.0",
    "elevenlabs>=1.0.0"
]
vision = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0"
]
desktop = [
    "PyAutoGUI>=0.9.54",
    "playwright>=1.40.0",
    "pygetwindow>=0.0.9",
    "pywinauto>=0.6.8",
    "mss>=9.0.1",
    "pyperclip>=1.8.2"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "PyAutoGUI>=0.9.54",
    "playwright>=1.40.0",
    "pygetwindow>=0.0.9",
    "pywinauto>=0.6.8",
    "mss>=9.0.1",
    "pyperclip>=1.8.2",
    "black",
    "ruff",
    "mypy"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
jarvisx = "jarvisx.__main__:main"
friday = "friday.__main__:main"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
