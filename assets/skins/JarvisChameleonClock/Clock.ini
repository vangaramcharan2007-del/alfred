[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Jarvis Chameleon Themed Clock
Author=Jarvis X / Alfred
Information=Theme-aware aesthetic clock featuring authentic franchise typography, adaptive wallpaper palettes, and negative-space placement.
Version=4.5.0

[Variables]
@include=#@#Variables.inc

; ==============================
; MEASURES
; ==============================

[MeasureHour]
Measure=Time
Format="%#I"

[MeasureMinute]
Measure=Time
Format="%M"

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%d %B %Y

; ==============================
; METERS (Pure Aesthetic Themed Clock)
; ==============================

; --- Day of the Week (Themed Franchise Typography) ---
[MeterDay]
Meter=String
MeasureName=MeasureDay
X=4
Y=0
FontColor=#ColorAccent#
FontFace=#FontTitle#
FontSize=(20*#Scale#)
StringCase=Upper
StringEffect=#StringEffect#
FontEffectColor=#ColorShadow#
InlineSetting=CharacterSpacing | (3*#Scale#) | (3*#Scale#)
AntiAlias=1
DynamicVariables=1

; --- Main Hour (Themed Numerals) ---
[MeterHour]
Meter=String
MeasureName=MeasureHour
X=0
Y=(26*#Scale#)
FontColor=#ColorPrimary#
FontFace=#FontTime#
FontSize=(82*#Scale#)
StringEffect=#StringEffect#
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Glowing Accent Colon ---
[MeterColon]
Meter=String
X=([MeterHour:X] + [MeterHour:W] + (2*#Scale#))
Y=(26*#Scale#)
FontColor=#ColorAccent#
FontFace=#FontTime#
FontSize=(74*#Scale#)
Text=":"
StringEffect=#StringEffect#
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Main Minute (Themed Numerals) ---
[MeterMinute]
Meter=String
MeasureName=MeasureMinute
X=([MeterColon:X] + [MeterColon:W] + (2*#Scale#))
Y=(26*#Scale#)
FontColor=#ColorPrimary#
FontFace=#FontTime#
FontSize=(82*#Scale#)
StringEffect=#StringEffect#
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- AM / PM Badge ---
[MeterAmPm]
Meter=String
MeasureName=MeasureAmPm
X=([MeterMinute:X] + [MeterMinute:W] + (8*#Scale#))
Y=(38*#Scale#)
FontColor=#ColorSub#
FontFace=#FontDate#
FontSize=(13*#Scale#)
StringCase=Upper
StringEffect=#StringEffect#
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Subtitle Date Line ---
[MeterDate]
Meter=String
MeasureName=MeasureDate
X=4
Y=([MeterHour:Y] + [MeterHour:H] + (2*#Scale#))
FontColor=#ColorMuted#
FontFace=#FontDate#
FontSize=(13*#Scale#)
StringCase=Upper
StringEffect=#StringEffect#
FontEffectColor=#ColorShadow#
InlineSetting=CharacterSpacing | (2*#Scale#) | (2*#Scale#)
AntiAlias=1
DynamicVariables=1
