[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Jarvis Chameleon Hero Clock
Author=Jarvis X / Alfred
Information=Ultra-sleek aesthetic hero clock that automatically adapts colors, typography, and negative-space placement to any wallpaper.
Version=3.0.0

[Variables]
@include=#@#Variables.inc

; ==============================
; MEASURES
; ==============================

[MeasureHour]
Measure=Time
Format="%#I"

[MeasureMinute]
Measure=Time
Format="%M"

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%d %B %Y

; ==============================
; METERS (Aesthetic Hero Layout)
; ==============================

; --- Day of the Week (Tracked Accent Title) ---
[MeterDay]
Meter=String
MeasureName=MeasureDay
X=4
Y=0
FontColor=#ColorAccent#
FontFace=#FontBold#
FontSize=(16*#Scale#)
StringCase=Upper
StringEffect=Shadow
FontEffectColor=#ColorShadow#
InlineSetting=CharacterSpacing | (5*#Scale#) | (5*#Scale#)
AntiAlias=1
DynamicVariables=1

; --- Main Hour (Ultra-Clean Light Numeral) ---
[MeterHour]
Meter=String
MeasureName=MeasureHour
X=0
Y=(20*#Scale#)
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=(84*#Scale#)
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Glowing Colon in Wallpaper Accent Color ---
[MeterColon]
Meter=String
X=([MeterHour:X] + [MeterHour:W] - (4*#Scale#))
Y=(24*#Scale#)
FontColor=#ColorAccent#
FontFace=#FontBold#
FontSize=(74*#Scale#)
Text=":"
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Minute (Ultra-Clean Light Numeral) ---
[MeterMinute]
Meter=String
MeasureName=MeasureMinute
X=([MeterColon:X] + [MeterColon:W] - (4*#Scale#))
Y=(20*#Scale#)
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=(84*#Scale#)
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- AM / PM Badge ---
[MeterAmPm]
Meter=String
MeasureName=MeasureAmPm
X=([MeterMinute:X] + [MeterMinute:W] + (8*#Scale#))
Y=(34*#Scale#)
FontColor=#ColorSub#
FontFace=#FontBold#
FontSize=(14*#Scale#)
StringCase=Upper
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Subtitle Date Line ---
[MeterDate]
Meter=String
MeasureName=MeasureDate
X=4
Y=([MeterHour:Y] + [MeterHour:H] - (4*#Scale#))
FontColor=#ColorMuted#
FontFace=#FontName#
FontSize=(13*#Scale#)
StringCase=Upper
StringEffect=Shadow
FontEffectColor=#ColorShadow#
InlineSetting=CharacterSpacing | (3*#Scale#) | (3*#Scale#)
AntiAlias=1
DynamicVariables=1
