[Rainmeter]
Update=1000
Author=Jarvis X / Alfred
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
LeftMouseDoubleClickAction=["python.exe" "c:\Users\vanga\Documents\Codex\2026-07-11\files-mentioned-by-the-user-you\outputs\project-jarvis-x\scripts\wallpaper_chameleon_engine.py"]

[Metadata]
Name=Jarvis Chameleon Aesthetic Clock
Author=Alfred / Jarvis X
Information=Adaptive aesthetic clock that dynamically matches wallpaper accent colors, contrast, and optimal screen placement.
Version=2.1.0

[Variables]
@include=#@#Variables.inc

; ==============================
; MEASURES
; ==============================

[MeasureTime]
Measure=Time
Format="%#I:%M"

[MeasureAmPm]
Measure=Time
Format="%p"

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%d  %B,  %Y.

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

; ==============================
; METERS
; ==============================

; --- Day of the Week (Aesthetic Display) ---
[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=Center
StringCase=Upper
FontFace=#FontFaceDay#
FontColor=#ColorPrimary#
FontSize=(42*#Scale#)
X=(350*#Scale#)
Y=0
Text="%1"
InlineSetting=CharacterSpacing | (10*#Scale#) | (10*#Scale#)
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Date Subtitle ---
[MeterDate]
Meter=String
MeasureName=MeasureDate
StringAlign=Center
StringCase=Upper
FontFace=#FontFaceDate#
FontColor=#ColorMuted#
FontSize=(14*#Scale#)
X=(350*#Scale#)
Y=(80*#Scale#)
Text="%1"
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Accent Time Badge ---
[MeterTime]
Meter=String
MeasureName=MeasureTime
MeasureName2=MeasureAmPm
StringAlign=Center
StringCase=Upper
FontFace=#FontFaceTime#
FontColor=#ColorAccent#
FontSize=(16*#Scale#)
X=(350*#Scale#)
Y=(124*#Scale#)
Text="- %1 %2 -"
InlineSetting=CharacterSpacing | (3*#Scale#) | (3*#Scale#)
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1

; --- Micro Telemetry Indicator (Subtle Status) ---
[MeterTelemetry]
Meter=String
MeasureName=MeasureCPU
MeasureName2=MeasureRAM
StringAlign=Center
FontFace=#FontFaceDate#
FontColor=#ColorSecondary#
FontSize=(10*#Scale#)
X=(350*#Scale#)
Y=(165*#Scale#)
Text="SYS [ CPU %1%  *  RAM %2% ]"
InlineSetting=CharacterSpacing | (1*#Scale#) | (1*#Scale#)
StringEffect=Shadow
FontEffectColor=#ColorShadow#
AntiAlias=1
DynamicVariables=1
