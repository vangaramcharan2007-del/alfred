[Rainmeter]
Update=40
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Jarvis Chameleon Themed Visualizer & Media Player
Author=Jarvis X / Alfred
Information=Audio spectrum visualizer and media status bar sharing dynamic franchise themes with Chameleon Clock.
Version=1.0.0

[Variables]
@include=#@#ThemeConfig.inc

; ==============================
; AUDIO SPECTRUM MEASURES (AudioLevel.dll)
; ==============================
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=40
FFTDecay=220
Bands=16
Sensitivity=35

; 16 Individual Frequency Bands
[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=1

