; ==============================
; NOW PLAYING MEASURE (Spotify / Windows Media)
; ==============================
[MeasurePlayer]
Measure=NowPlaying
PlayerName=CAD
PlayerType=Status

[MeasureTrack]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Title
Substitute="":"System Audio Standby"

[MeasureArtist]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Artist
Substitute="":"Chameleon Audio Sync Active"

