server:
  port: 8080

spring:
  application:
    name: weather-intelligence
  profiles:
    active: h2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/weatherdb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:

weather:
  api:
    key: ${OPENWEATHER_API_KEY:demo}
    base-url: https://api.openweathermap.org
    units: metric
  refresh:
    interval-minutes: 5

logging:
  level:
    com.weatherintel: DEBUG
    org.springframework.web: INFO
