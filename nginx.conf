server {
    listen 80;
    server_name localhost;

    # Frontend (Next.js)
    location / {
        proxy_pass http://aegis-ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://aegis-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Direct backend endpoints (video feed, status, etc.)
    location ~ ^/(status|ingest-telemetry|companion-interact|video_feed|memory-records|patient|mesh|diagnostics|clinical-handover|sih|voice|medical-protocols|cds-hooks) {
        proxy_pass http://aegis-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        # SSE / streaming support
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
