<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer System Architecture — Luxury Tech Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-carbon: #12141c;
      --bg-darker: #0c0d14;
      --card-bg: rgba(26, 30, 42, 0.85);
      --card-highlight: rgba(38, 45, 64, 0.9);
      --card-border: #2e364a;
      --card-hover-border: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #a0afc8;
      --text-dim: #6e7d96;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #34d399;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --pill-bg: #1e2434;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-darker);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(129, 140, 248, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
      animation: ambientShift 12s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    header.control-bar {
      position: relative;
      z-index: 100;
      height: 54px;
      background: rgba(18, 20, 28, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .brand span {
      color: var(--text-white);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.2);
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .timer-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
    }

    main.stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 10;
    }

    .slide-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-carbon);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.85), 0 0 40px rgba(56, 189, 248, 0.08);
      display: flex;
      flex-direction: column;
      padding: 2.2rem 2.8rem;
      overflow: hidden;
    }

    .slide-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }

    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pill {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
    }

    .pill-act {
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .pill-speaker {
      color: var(--accent-indigo);
      border-color: rgba(129, 140, 248, 0.4);
      background: rgba(129, 140, 248, 0.1);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--pill-bg);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .slide-titles {
      margin-bottom: 1.25rem;
    }

    .slide-titles h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .slide-titles p {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .slide-body {
      flex: 1;
      display: grid;
      gap: 1.25rem;
      align-items: stretch;
    }

    .grid-2-col {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3-col {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4-col {
      grid-template-columns: repeat(4, 1fr);
    }

    .grid-split-img {
      grid-template-columns: 1.15fr 1fr;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: cardSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
    }

    .card::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      border-right: 2px solid rgba(255, 255, 255, 0.2);
    }

    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-cyan);
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .card-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .card-list li {
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-muted);
      position: relative;
      padding-left: 1.1rem;
    }

    .card-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 1.1rem;
    }

    .card-list li strong {
      color: var(--text-white);
      font-weight: 600;
    }

    .diagram-container {
      background: rgba(14, 16, 24, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .diagram-container::before {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .diagram-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .diagram-img:hover {
      transform: scale(1.03);
    }

    .bottom-banner {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }

    .banner-tag {
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .banner-text {
      color: var(--text-white);
    }

    .notes-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 20, 28, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--accent-cyan);
      padding: 1.25rem 2rem;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 35vh;
      overflow-y: auto;
      box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.6);
    }

    .notes-drawer.open {
      transform: translateY(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .notes-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1.25rem;
    }

    .note-block {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .note-block h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-indigo);
      margin-bottom: 0.35rem;
    }

    .note-block p {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text-white);
    }

    .fade-in {
      animation: slideMorph 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideMorph {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="control-bar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M10 4v4"/><path d="M14 4v4"/><path d="M4 10h16"/><path d="M10 14h4"/></svg>
      <span>COMPUTER SYSTEM ARCHITECTURE</span> / LUXURY TECH PRESENTATION
    </div>

    <div class="nav-actions">
      <div class="timer-badge" id="slideTimer" title="Current slide rehearsal timer">00:00</div>
      <button class="btn" id="prevBtn" title="Previous Slide (Left Arrow)">◀ Prev</button>
      <button class="btn" id="nextBtn" title="Next Slide (Right Arrow / Space)">Next ▶</button>
      <button class="btn" id="notesBtn" title="Toggle Presenter Notes (N)">📝 Notes</button>
      <button class="btn" id="fullscreenBtn" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>
    </div>
  </header>

  <main class="stage">
    <div class="slide-wrapper fade-in" id="slideContainer">
      <!-- Injected by Javascript -->
    </div>
  </main>

  <div class="notes-drawer" id="notesDrawer">
    <div class="notes-header">
      <div class="notes-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        PRESENTER SCRIPT — <span id="notesSpeaker">V. RAM CHARAN</span>
      </div>
      <button class="btn" id="closeNotesBtn">✕ Close</button>
    </div>
    <div class="notes-grid">
      <div class="note-block">
        <h4>1. What to Say (Spoken Script)</h4>
        <p id="noteSpeech">Script text here...</p>
      </div>
      <div class="note-block">
        <h4>2. Key Architectural Concept</h4>
        <p id="noteConcept">Core concept...</p>
      </div>
      <div class="note-block">
        <h4>3. Transition & Cue</h4>
        <p id="noteTransition">Transition...</p>
        <p style="margin-top: 0.35rem; color: var(--accent-amber);" id="noteCue">Cue...</p>
      </div>
    </div>
  </div>

  <script>
    const slidesData = [
      {
        id: 1,
        act: "Act I: Core Hardware",
        speaker: "V. Ram Charan (RAM)",
        title: "Computer System Architecture",
        subtitle: "Core Hardware, Storage Hierarchies & Modern Multiprocessing",
        render: () => `
          <div style="flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 2rem; align-items: center;">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <h1 style="font-size: 2.8rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.5px;">Computer System Architecture</h1>
              <p style="font-size: 1.2rem; color: var(--accent-cyan); font-weight: 600;">Core Hardware, Storage Hierarchies & Modern Multiprocessing</p>
              <p style="font-size: 0.9rem; color: var(--text-dim);">Operating Systems — System Architecture & Execution Foundations</p>
              
              <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 1rem; background: var(--pill-bg); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--card-border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(56, 189, 248, 0.2); display: flex; align-items: center; justify-content: center; color: var(--accent-cyan); font-weight: bold;">RC</div>
                  <div>
                    <div style="font-weight: 700; color: #fff;">V. Ram Charan (RAM)</div>
                    <div style="font-size: 0.75rem; color: var(--accent-cyan);">Act I Lead — Core Hardware & System Bus (Slides 1–5)</div>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem; background: var(--pill-bg); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--card-border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(129, 140, 248, 0.2); display: flex; align-items: center; justify-content: center; color: var(--accent-indigo); font-weight: bold;">VD</div>
                  <div>
                    <div style="font-weight: 700; color: #fff;">Vedhanth</div>
                    <div style="font-size: 0.75rem; color: var(--accent-indigo);">Act II Lead — Memory & Storage Hierarchy (Slides 6–10)</div>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem; background: var(--pill-bg); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--card-border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(52, 211, 153, 0.2); display: flex; align-items: center; justify-content: center; color: var(--accent-emerald); font-weight: bold;">LC</div>
                  <div>
                    <div style="font-weight: 700; color: #fff;">Lochan</div>
                    <div style="font-size: 0.75rem; color: var(--accent-emerald);">Act III Lead — Multiprocessing & Modern Systems (Slides 11–15)</div>
                  </div>
                </div>
              </div>

              <div style="border-left: 3px solid var(--accent-cyan); padding-left: 1rem; margin-top: 0.5rem;">
                <p style="font-size: 0.95rem; font-style: italic; color: var(--text-muted);">"The operating system is the software most intimately involved with computer hardware."</p>
              </div>
            </div>
            <div class="diagram-container">
              <img src="assets/presentation/gamma_assets/iso_motherboard.png" class="diagram-img" alt="Isometric Motherboard">
            </div>
          </div>
        `,
        speech: "Good morning everyone. I’ll be explaining the core hardware of a computer system. Together with Vedhanth and Lochan, we will walk you through how hardware components communicate, how memory hierarchies optimize speed and capacity, and how modern multiprocessing systems scale concurrent execution.",
        concept: "Computer system architecture establishes the hardware foundation for operating system process management, memory allocation, and I/O handling.",
        transition: "Let us begin with Slide 2 by examining the three core hardware components: the CPU, main memory, and I/O devices.",
        cue: "Stand center, introduce team members, gesture to the presenter cards."
      },
      {
        id: 2,
        act: "Act I: Core Hardware",
        speaker: "V. Ram Charan (RAM)",
        title: "Core Hardware of a Computer System",
        subtitle: "The Three Fundamental Hardware Pillars Powering Execution",
        render: () => `
          <div class="slide-body grid-3-col">
            <div class="card">
              <div class="card-accent-bar"></div>
              <div class="card-title">1. The CPU (Processor)</div>
              <ul class="card-list">
                <li><strong>Fetch, Decode, Execute:</strong> Continuously fetches instructions from memory and processes operations.</li>
                <li><strong>Core Units:</strong> Contains the Arithmetic Logic Unit (ALU), Control Unit (CU), and internal registers.</li>
                <li><strong>System Driver:</strong> Directs computational logic across all attached peripherals.</li>
              </ul>
            </div>
            <div class="card">
              <div class="card-accent-bar" style="background: var(--accent-indigo);"></div>
              <div class="card-title" style="color: var(--accent-indigo);">2. Main Memory (RAM)</div>
              <ul class="card-list">
                <li><strong>Primary Workspace:</strong> Stores active data and programs that are currently being used by the system.</li>
                <li><strong>Direct Access:</strong> The only large memory directly addressable and executable by the CPU.</li>
                <li><strong>Volatile Storage:</strong> Contents exist dynamically during runtime.</li>
              </ul>
            </div>
            <div class="card">
              <div class="card-accent-bar" style="background: var(--accent-emerald);"></div>
              <div class="card-title" style="color: var(--accent-emerald);">3. I/O Devices</div>
              <ul class="card-list">
                <li><strong>Outside Bridge:</strong> Helps the computer communicate with users and external devices.</li>
                <li><strong>Peripherals:</strong> Displays, keyboards, network interfaces, SSDs, and disk controllers.</li>
                <li><strong>Autonomous Control:</strong> Dedicated device controllers manage physical hardware protocols.</li>
              </ul>
            </div>
          </div>
        `,
        speech: "A computer system mainly consists of three parts: the CPU, main memory, and I/O devices. The CPU is responsible for fetching, decoding, and executing instructions. Main memory stores the data and programs that are currently being used, while I/O devices help the computer communicate with the outside world.",
        concept: "The CPU, RAM, and I/O form the triad of computer architecture; the CPU cannot run code that is not first loaded into main memory.",
        transition: "Now let's examine how these three components communicate with each other over the system bus.",
        cue: "Point to the 3 distinct cards highlighting CPU, Main Memory, and I/O Devices."
      },
      {
        id: 3,
        act: "Act I: Core Hardware",
        speaker: "V. Ram Charan (RAM)",
        title: "The System Bus Architecture",
        subtitle: "Three Specialized High-Speed Communication Channels",
        render: () => `
          <div class="slide-body grid-split-img">
            <div style="display: flex; flex-direction: column; gap: 0.85rem;">
              <div class="card">
                <div class="card-accent-bar"></div>
                <div class="card-title">1. Address Bus</div>
                <p class="card-text">Tells <strong>WHERE</strong> the data should go by carrying physical memory addresses and I/O port numbers (Unidirectional from CPU/DMA).</p>
              </div>
              <div class="card">
                <div class="card-accent-bar" style="background: var(--accent-indigo);"></div>
                <div class="card-title" style="color: var(--accent-indigo);">2. Data Bus</div>
                <p class="card-text">Carries the <strong>ACTUAL DATA</strong> and binary instructions between CPU, main memory, and device controllers (Bidirectional).</p>
              </div>
              <div class="card">
                <div class="card-accent-bar" style="background: var(--accent-emerald);"></div>
                <div class="card-title" style="color: var(--accent-emerald);">3. Control Bus</div>
                <p class="card-text">Carries <strong>CONTROL SIGNALS</strong> and timing commands — such as Memory Read/Write, I/O Read/Write, and Clock signals (Bidirectional).</p>
              </div>
            </div>
            <div class="diagram-container">
              <img src="assets/presentation/gamma_assets/iso_system_bus.png" class="diagram-img" alt="3-Part System Bus">
            </div>

              </div>
            </div>
          </div>
        `,
        speech: "To summarize our complete presentation: Ram Charan walked us through the core hardware and 3-part system bus; Vedhanth explained the storage hierarchy, locality of reference, and OS caching optimizations; and Lochan covered multiprocessing architectures, SMP vs AMP, multicore, clustering, and OS coordination challenges. On behalf of Ram Charan, Vedhanth, and Lochan, thank you for your attention. We are now open for questions.",
        concept: "Comprehensive architectural synthesis covering core hardware, system bus, storage hierarchy, locality, multiprocessing, and OS coordination.",
        transition: "End of presentation — open floor for Q&A.",
        cue: "All three presenters step forward together, smile, and invite questions from the professor and audience."
      }
    ];

    let currentSlideIdx = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    function renderSlide(idx) {
      if (idx < 0 || idx >= slidesData.length) return;
      currentSlideIdx = idx;
      const slide = slidesData[idx];
      const container = document.getElementById("slideContainer");

      container.className = "slide-wrapper fade-in";
      container.innerHTML = `
        <div class="slide-header">
          <div class="header-pills">
            <div class="pill pill-act">${slide.act}</div>
            <div class="pill pill-speaker">PRESENTER: ${slide.speaker}</div>
          </div>
          <div class="slide-counter">${String(slide.id).padStart(2, '0')} / 15</div>
        </div>
        <div class="slide-titles">
          <h1>${slide.title}</h1>
          <p>${slide.subtitle}</p>
        </div>
        ${slide.render()}
      `;

      document.getElementById("notesSpeaker").textContent = slide.speaker.toUpperCase();
      document.getElementById("noteSpeech").textContent = slide.speech;
      document.getElementById("noteConcept").textContent = slide.concept;
      document.getElementById("noteTransition").textContent = slide.transition;
      document.getElementById("noteCue").textContent = "Cue: " + slide.cue;

      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById("slideTimer").textContent = `${mins}:${secs}`;
    }

    document.getElementById("prevBtn").onclick = () => {
      if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1);
    };

    document.getElementById("nextBtn").onclick = () => {
      if (currentSlideIdx < slidesData.length - 1) renderSlide(currentSlideIdx + 1);
    };

    document.getElementById("notesBtn").onclick = () => {
      const drawer = document.getElementById("notesDrawer");
      drawer.classList.toggle("open");
      document.getElementById("notesBtn").classList.toggle("btn-active", drawer.classList.contains("open"));
    };

    document.getElementById("closeNotesBtn").onclick = () => {
      document.getElementById("notesDrawer").classList.remove("open");
      document.getElementById("notesBtn").classList.remove("btn-active");
    };

    document.getElementById("fullscreenBtn").onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        if (currentSlideIdx < slidesData.length - 1) renderSlide(currentSlideIdx + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1);
      } else if (e.key === "Home") {
        renderSlide(0);
      } else if (e.key === "End") {
        renderSlide(slidesData.length - 1);
      } else if (e.key.toLowerCase() === "n") {
        document.getElementById("notesBtn").click();
      } else if (e.key.toLowerCase() === "f") {
        document.getElementById("fullscreenBtn").click();
      } else if (e.key === "Escape") {
        document.getElementById("notesDrawer").classList.remove("open");
      }
    });

    renderSlide(0);
  </script>
</body>
</html>
