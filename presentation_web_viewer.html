<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer System Architecture — Luxury Tech Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-carbon: #12141c;
      --bg-darker: #0c0d14;
      --card-bg: rgba(26, 30, 42, 0.85);
      --card-highlight: rgba(38, 45, 64, 0.9);
      --card-border: #2e364a;
      --card-hover-border: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #a0afc8;
      --text-dim: #6e7d96;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #34d399;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --pill-bg: #1e2434;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-darker);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      user-select: none;
      perspective: 1200px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(129, 140, 248, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
      animation: ambientShift 12s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    header.control-bar {
      position: relative;
      z-index: 100;
      height: 54px;
      background: rgba(18, 20, 28, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .brand span {
      color: var(--text-white);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.2);
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .timer-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
    }

    main.stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 10;
      overflow: hidden;
    }

    .slide-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-carbon);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.85), 0 0 40px rgba(56, 189, 248, 0.08);
      display: flex;
      flex-direction: column;
      padding: 2.2rem 2.8rem;
      overflow: hidden;
      transform-origin: center center;
      backface-visibility: hidden;
    }

    .slide-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }

    /* === TRANSITION ANIMATION MODES === */
    
    /* 1. Fluid Morph & Scale */
    .transition-morph-next {
      animation: morphNext 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .transition-morph-prev {
      animation: morphPrev 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes morphNext {
      0% { opacity: 0; transform: scale(0.96) translateY(12px); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }
    @keyframes morphPrev {
      0% { opacity: 0; transform: scale(1.04) translateY(-12px); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* 2. 3D Perspective Glide */
    .transition-3d-next {
      animation: flipNext 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .transition-3d-prev {
      animation: flipPrev 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes flipNext {
      0% { opacity: 0; transform: perspective(1000px) rotateY(-8deg) translateX(50px) scale(0.95); }
      100% { opacity: 1; transform: perspective(1000px) rotateY(0deg) translateX(0) scale(1); }
    }
    @keyframes flipPrev {
      0% { opacity: 0; transform: perspective(1000px) rotateY(8deg) translateX(-50px) scale(0.95); }
      100% { opacity: 1; transform: perspective(1000px) rotateY(0deg) translateX(0) scale(1); }
    }

    /* 3. Cinematic Zoom & Fade */
    .transition-zoom-next {
      animation: zoomNext 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .transition-zoom-prev {
      animation: zoomPrev 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes zoomNext {
      0% { opacity: 0; transform: scale(1.08); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes zoomPrev {
      0% { opacity: 0; transform: scale(0.92); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    /* Card Stagger Entrance Animations */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      animation: cardCascade 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .slide-body .card:nth-child(1) { animation-delay: 0.06s; }
    .slide-body .card:nth-child(2) { animation-delay: 0.14s; }
    .slide-body .card:nth-child(3) { animation-delay: 0.22s; }
    .slide-body .card:nth-child(4) { animation-delay: 0.30s; }

    @keyframes cardCascade {
      0% { opacity: 0; transform: translateY(16px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 16px 36px rgba(56, 189, 248, 0.2);
    }

    .card::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-top: 2px solid rgba(255, 255, 255, 0.25);
      border-right: 2px solid rgba(255, 255, 255, 0.25);
    }

    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-cyan);
    }

    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pill {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
    }

    .pill-act {
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .pill-speaker {
      color: var(--accent-indigo);
      border-color: rgba(129, 140, 248, 0.4);
      background: rgba(129, 140, 248, 0.1);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--pill-bg);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .slide-titles {
      margin-bottom: 1.25rem;
    }

    .slide-titles h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .slide-titles p {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    .slide-body {
      flex: 1;
      display: grid;
      gap: 1.25rem;
      align-items: stretch;
    }

    .grid-2-col {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3-col {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4-col {
      grid-template-columns: repeat(4, 1fr);
    }

    .grid-split-img {
      grid-template-columns: 1.15fr 1fr;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .card-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .card-list li {
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-muted);
      position: relative;
      padding-left: 1.1rem;
    }

    .card-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 1.1rem;
    }

    .card-list li strong {
      color: var(--text-white);
      font-weight: 600;
    }

    .diagram-container {
      background: rgba(14, 16, 24, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .diagram-container::before {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .diagram-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .diagram-img:hover {
      transform: scale(1.03);
    }

    .notes-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 20, 28, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--accent-cyan);
      padding: 1.25rem 2rem;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 35vh;
      overflow-y: auto;
      box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.6);
    }

    .notes-drawer.open {
      transform: translateY(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .notes-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1.25rem;
    }

    .note-block {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .note-block h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-indigo);
      margin-bottom: 0.35rem;
    }

    .note-block p {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text-white);
    }
  </style>
</head>

        subtitle: "The CPU, Main Memory & I/O Devices Powering Computation",

                <li><strong>Autonomous Control:</strong> Dedicated device controllers manage physical protocols.</li>
              </ul>
            </div>

              <div class="card-accent-bar" style="background: var(--accent-rose);"></div>
              <div class="card-title" style="color: var(--accent-rose); font-size: 1rem;">★ OS Coordination</div>
              <p class="card-text">The critical software that manages all this complex hardware—coordinating scheduling, cache coherence, load balancing, and synchronization.</p>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
              <div class="card" style="padding: 0.75rem; text-align: center; border-color: var(--accent-cyan);">
                <div style="font-weight: 800; color: #fff;">V. Ram Charan</div>
                <div style="font-size: 0.75rem; color: var(--accent-cyan);">Act I: Core Hardware (Slides 1–5)</div>
              </div>
              <div class="card" style="padding: 0.75rem; text-align: center; border-color: var(--accent-indigo);">
                <div style="font-weight: 800; color: #fff;">Vedhanth</div>
                <div style="font-size: 0.75rem; color: var(--accent-indigo);">Act II: Memory & Storage Hierarchy (Slides 6–10)</div>
              </div>
              <div class="card" style="padding: 0.75rem; text-align: center; border-color: var(--accent-emerald);">
                <div style="font-weight: 800; color: #fff;">Lochan</div>
                <div style="font-size: 0.75rem; color: var(--accent-emerald);">Act III: Multiprocessing & Modern Systems (Slides 11–15)</div>
              </div>
            </div>
          </div>
        `,
        speech: "To summarize our complete presentation: Ram Charan walked us through the core hardware and 3-part system bus; Vedhanth explained the storage hierarchy, locality of reference, and OS caching optimizations; and Lochan covered multiprocessing architectures, SMP vs AMP, multicore, clustering, and OS coordination challenges. On behalf of Ram Charan, Vedhanth, and Lochan, thank you for your attention. We are now open for questions.",
        concept: "Comprehensive architectural synthesis covering core hardware, system bus, storage hierarchy, locality, multiprocessing, and OS coordination.",
        transition: "End of presentation — open floor for Q&A.",
        cue: "All three presenters step forward together, smile, and invite questions from the professor and audience."
      }
    ];

    let currentSlideIdx = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    function renderSlide(idx, direction = "next") {
      if (idx < 0 || idx >= slidesData.length) return;
      currentSlideIdx = idx;
      const slide = slidesData[idx];
      const container = document.getElementById("slideContainer");
      const mode = transitionModes[currentTransitionModeIdx];

      container.className = `slide-wrapper transition-${mode}-${direction}`;
      container.innerHTML = `
        <div class="slide-header">
          <div class="header-pills">
            <div class="pill pill-act">${slide.act}</div>
            <div class="pill pill-speaker">PRESENTER: ${slide.speaker}</div>
          </div>
          <div class="slide-counter">${String(slide.id).padStart(2, '0')} / 15</div>
        </div>
        <div class="slide-titles">
          <h1>${slide.title}</h1>
          <p>${slide.subtitle}</p>
        </div>
        ${slide.render()}
      `;

      document.getElementById("notesSpeaker").textContent = slide.speaker.toUpperCase();
      document.getElementById("noteSpeech").textContent = slide.speech;
      document.getElementById("noteConcept").textContent = slide.concept;
      document.getElementById("noteTransition").textContent = slide.transition;
      document.getElementById("noteCue").textContent = "Cue: " + slide.cue;

      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById("slideTimer").textContent = `${mins}:${secs}`;
    }

    document.getElementById("prevBtn").onclick = () => {
      if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1, "prev");
    };

    document.getElementById("nextBtn").onclick = () => {
      if (currentSlideIdx < slidesData.length - 1) renderSlide(currentSlideIdx + 1, "next");
    };

    document.getElementById("transitionModeBtn").onclick = () => {
      currentTransitionModeIdx = (currentTransitionModeIdx + 1) % transitionModes.length;
      const modeNames = ["✨ Morph FX", "🎲 3D Glide", "🔍 Zoom Blur"];
      document.getElementById("transitionModeBtn").textContent = modeNames[currentTransitionModeIdx];
      renderSlide(currentSlideIdx, "next");
    };

    document.getElementById("notesBtn").onclick = () => {
      const drawer = document.getElementById("notesDrawer");
      drawer.classList.toggle("open");
      document.getElementById("notesBtn").classList.toggle("btn-active", drawer.classList.contains("open"));
    };

    document.getElementById("closeNotesBtn").onclick = () => {
      document.getElementById("notesDrawer").classList.remove("open");
      document.getElementById("notesBtn").classList.remove("btn-active");
    };

    document.getElementById("fullscreenBtn").onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        if (currentSlideIdx < slidesData.length - 1) renderSlide(currentSlideIdx + 1, "next");
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1, "prev");
      } else if (e.key === "Home") {
        renderSlide(0, "prev");
      } else if (e.key === "End") {
        renderSlide(slidesData.length - 1, "next");
      } else if (e.key.toLowerCase() === "t") {
        document.getElementById("transitionModeBtn").click();
      } else if (e.key.toLowerCase() === "n") {
        document.getElementById("notesBtn").click();
      } else if (e.key.toLowerCase() === "f") {
        document.getElementById("fullscreenBtn").click();
      } else if (e.key === "Escape") {
        document.getElementById("notesDrawer").classList.remove("open");
      }
    });

    renderSlide(0, "next");
  </script>
</body>
</html>
