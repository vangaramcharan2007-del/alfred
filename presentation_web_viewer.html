<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer System Architecture — OS Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080c14;
      --bg-slate: #0d1322;
      --card-bg: rgba(21, 28, 44, 0.75);
      --card-border: rgba(56, 189, 248, 0.2);
      --card-hover: rgba(56, 189, 248, 0.35);
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #34d399;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --pill-bg: rgba(30, 41, 59, 0.85);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vh;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(129, 140, 248, 0.04) 50%, transparent 80%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 60vw;
      height: 60vh;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.08) 0%, rgba(52, 211, 153, 0.04) 50%, transparent 80%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Control Bar */
    header.control-bar {
      position: relative;
      z-index: 100;
      height: 52px;
      background: rgba(13, 19, 34, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .brand span {
      color: var(--text-white);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
      transform: translateY(-1px);
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .timer-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
    }

    /* Main Presentation Stage */
    main.stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 10;
    }

    .slide-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background: var(--bg-slate);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.05);
      display: flex;
      flex-direction: column;
      padding: 2.2rem 2.8rem;
      overflow: hidden;
    }

    /* Slide Header */
    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pill {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
    }

    .pill-act {
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .pill-speaker {
      color: var(--accent-indigo);
      border-color: rgba(129, 140, 248, 0.4);
      background: rgba(129, 140, 248, 0.1);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--pill-bg);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .slide-titles {
      margin-bottom: 1.2rem;
    }

    .slide-titles h1 {
      font-family: var(--font-heading);
      font-size: 1.95rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .slide-titles p {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      font-weight: 500;
      margin-top: 0.25rem;
    }

    /* Slide Content Grid Layouts */
    .slide-body {
      flex: 1;
      display: grid;
      gap: 1.25rem;
      align-items: stretch;
    }

    .grid-2-col {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3-col {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-split-img {
      grid-template-columns: 1.15fr 1fr;
    }

    /* Card Component */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: var(--card-hover);
    }

    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-cyan);
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .card-list li {
      font-size: 0.86rem;
      line-height: 1.45;
      color: var(--text-muted);
      position: relative;
      padding-left: 1.1rem;
    }

    .card-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1;
    }

    .card-list li strong {
      color: var(--text-white);
      font-weight: 600;
    }

    /* Diagram Containers */
    .diagram-container {
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .diagram-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Flow Step Visualizer */
    .flow-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.65rem 1rem;
      margin-bottom: 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .flow-step {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent-cyan);
    }

    .flow-step span {
      color: var(--text-white);
      font-weight: 500;
    }

    .flow-arrow {
      color: var(--accent-amber);
      font-weight: bold;
    }

    /* Slide Footer */
    .slide-footer {
      margin-top: 0.8rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    /* Notes Drawer */
    .notes-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 19, 34, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      padding: 1.25rem 2rem;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 35vh;
      overflow-y: auto;
      box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.5);
    }

    .notes-drawer.open {
      transform: translateY(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .notes-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1.25rem;
    }

    .note-block {
      background: var(--pill-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .note-block h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-indigo);
      margin-bottom: 0.35rem;
    }

    .note-block p {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text-white);
    }

    /* Overview Modal */
    .overview-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 20, 0.92);
      backdrop-filter: blur(20px);
      z-index: 300;
      padding: 3rem;
      display: none;
      flex-direction: column;
    }

    .overview-modal.open {
      display: flex;
    }

    .overview-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      overflow-y: auto;
      padding: 1rem 0;
    }

    .thumb-card {
      background: var(--bg-slate);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 120px;
    }

    .thumb-card:hover, .thumb-card.active {
      border-color: var(--accent-cyan);
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .thumb-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .thumb-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-white);
      line-height: 1.2;
    }

    .thumb-speaker {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Comparison Table */
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .compare-table th {
      background: var(--pill-bg);
      color: var(--accent-cyan);
      font-family: var(--font-heading);
      font-weight: 700;
      text-align: left;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
    }

    .compare-table td {
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .compare-table tr:hover td {
      background: rgba(56, 189, 248, 0.04);
    }

    .compare-table td strong {
      color: var(--text-white);
    }

    /* Animations */
    .fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <!-- Top Control Bar -->
  <header class="control-bar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M10 4v4"/><path d="M14 4v4"/><path d="M4 10h16"/><path d="M10 14h4"/></svg>
      <span>SILBERSCHATZ OS</span> / CHAPTER 1
    </div>

    <div class="nav-actions">
      <div class="timer-badge" id="slideTimer" title="Current slide rehearsal timer">00:00</div>
      <button class="btn" id="prevBtn" title="Previous Slide (Left Arrow)">◀ Prev</button>
      <button class="btn" id="nextBtn" title="Next Slide (Right Arrow / Space)">Next ▶</button>
      <button class="btn" id="notesBtn" title="Toggle Presenter Notes (N)">📝 Notes</button>
      <button class="btn" id="gridBtn" title="Slide Overview Grid (O)">☷ Grid</button>
      <button class="btn" id="fullscreenBtn" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>

  </header>

  <!-- Slide Presentation Stage -->
  <main class="stage">
    <div class="slide-wrapper fade-in" id="slideContainer">
      <!-- Injected by Javascript -->
    </div>
  </main>

  <!-- Presenter Notes Drawer -->
  <div class="notes-drawer" id="notesDrawer">
    <div class="notes-header">
      <div class="notes-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        PRESENTER NOTES — <span id="notesSpeaker">V. RAM CHARAN</span>
      </div>
      <button class="btn" id="closeNotesBtn">✕ Close</button>
    </div>
    <div class="notes-grid">
      <div class="note-block">
        <h4>1. What to Say (Spoken Script)</h4>
        <p id="noteSpeech">Script text here...</p>
      </div>
      <div class="note-block">
        <h4>2. Key Concept</h4>
        <p id="noteConcept">Core concept...</p>
      </div>
      <div class="note-block">
        <h4>3. Transition & Cue</h4>
        <p id="noteTransition">Transition...</p>
        <p style="margin-top: 0.35rem; color: var(--accent-amber);" id="noteCue">Cue...</p>
      </div>
    </div>
  </div>

  <!-- Overview Modal -->
  <div class="overview-modal" id="overviewModal">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 style="font-family: var(--font-heading); color: var(--accent-cyan);">15-Slide Presentation Overview</h2>
      <button class="btn" id="closeGridBtn">✕ Close Overview</button>
    </div>
    <div class="overview-grid" id="overviewGrid">
      <!-- Injected by Javascript -->
    </div>
  </div>

  <script>
    const slidesData = [
      {
        id: 1,
        act: "Act I: Foundations",
        speaker: "V. Ram Charan",
        title: "Computer System Architecture",
        subtitle: "Understanding the Hardware Foundation of Operating Systems",
        render: () => `
          <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1.25rem;">
            <div class="pill pill-act" style="padding: 0.4rem 1.2rem; font-size: 0.85rem;">OPERATING SYSTEMS • CHAPTER 1 INTRODUCTION</div>
            <h1 style="font-size: 3rem; font-weight: 800; line-height: 1.1; letter-spacing: -1px; max-width: 900px;">Computer System Architecture</h1>
            <p style="font-size: 1.25rem; color: var(--accent-cyan); font-weight: 600;">Understanding the Hardware Foundation of Operating Systems</p>
            
            <div class="card" style="max-width: 850px; padding: 1rem 1.5rem; border-color: rgba(129, 140, 248, 0.4); background: rgba(30, 41, 59, 0.5);">
              <p style="font-size: 1.05rem; font-style: italic; color: #fff; line-height: 1.5;">"The operating system is the software most intimately involved with computer hardware."</p>
              <span style="font-size: 0.8rem; color: var(--accent-cyan); margin-top: 0.4rem; display: block;">— Silberschatz, Galvin & Gagne (Operating System Concepts, 10th Edition)</span>
            </div>

            <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
              <div class="card" style="width: 240px; padding: 0.75rem 1rem; border-color: var(--accent-cyan);">
                <div style="font-weight: 800; color: #fff;">V. RAM CHARAN</div>
                <div style="font-size: 0.75rem; color: var(--accent-cyan);">Speaker 1 (Act I Lead)</div>
              </div>
              <div class="card" style="width: 240px; padding: 0.75rem 1rem; border-color: var(--accent-indigo);">
                <div style="font-weight: 800; color: #fff;">VEDHANTH</div>
                <div style="font-size: 0.75rem; color: var(--accent-indigo);">Speaker 2 (Act II Lead)</div>
              </div>
              <div class="card" style="width: 240px; padding: 0.75rem 1rem; border-color: var(--accent-emerald);">
                <div style="font-weight: 800; color: #fff;">LOCHAN</div>
                <div style="font-size: 0.75rem; color: var(--accent-emerald);">Speaker 3 (Act III Lead)</div>
              </div>
            </div>
          </div>
        `,
        speech: "Good morning everyone. Welcome to our presentation on Computer System Architecture. I am Ram Charan, and along with my co-presenters Vedhanth and Lochan, we will walk you through how computer hardware and the operating system interact, based on Chapter 1 of Silberschatz's Operating System Concepts 10th Edition. The OS is the critical layer that transforms raw silicon, memory, and devices into a cohesive, secure platform.",
        concept: "The Operating System as the software most intimately involved with computer hardware, balancing resource allocation and control.",
        transition: "Let us begin with Slide 2 by looking at the four fundamental components that make up any computer system.",
        cue: "Stand center, acknowledge professors and classmates, gesture to team member names."
      },
      {
        id: 2,
        act: "Act I: Foundations",
        speaker: "V. Ram Charan",
        title: "What is a Computer System?",
        subtitle: "Four Major Components & The Role of the Operating System (Silberschatz Figure 1.1)",
        render: () => `
          <div class="slide-body grid-split-img">
            <div class="diagram-container">
              <img src="assets/presentation/system_components.png" class="diagram-img" alt="Abstract View of System Components">
            </div>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <div class="card">
                <div class="card-accent-bar"></div>
                <div class="card-title">1. Resource Allocator Role</div>
                <ul class="card-list">
                  <li><strong>CPU Time & Memory:</strong> Manages CPU cycles, memory allocation, and storage space.</li>
                  <li><strong>Fair Resolution:</strong> Resolves conflicting resource requests from multiple users and programs fairly and efficiently.</li>
                </ul>
              </div>
              <div class="card">
                <div class="card-accent-bar" style="background: var(--accent-emerald);"></div>
                <div class="card-title" style="color: var(--accent-emerald);">2. Control Program Role</div>
                <ul class="card-list">
                  <li><strong>Execution Supervision:</strong> Controls execution of user programs to prevent errors.</li>
                  <li><strong>Improper Operation Prevention:</strong> Protects against unauthorized hardware manipulation and system crashes.</li>
                </ul>
              </div>
              <div class="card">
                <div class="card-accent-bar" style="background: var(--accent-indigo);"></div>
                <div class="card-title" style="color: var(--accent-indigo);">Hardware & Applications</div>
                <p class="card-text">Hardware provides basic computing resources (CPU, Memory, I/O). Applications define how resources solve user problems. The OS coordinates both.</p>
              </div>
            </div>
          </div>
        `,
        speech: "Silberschatz breaks a computer system into four components: Users, Application Programs, the Operating System, and Computer Hardware. Hardware supplies raw computational power—the CPU, main memory, and I/O devices. Applications want to use those resources. Sitting right between them is the Operating System. The textbook emphasizes that the OS acts as both a Resource Allocator—deciding how CPU time and memory are shared among competing requests—and as a Control Program—preventing bugs and illegal operations from crashing the machine.",
        concept: "Four-component computer system model & OS duality as Resource Allocator and Control Program.",
        transition: "Now let's examine how computer system architectures have evolved from single-processor systems to modern multi-core chips.",
        cue: "Point to the vertical diagram showing the OS buffering applications from raw hardware."
      },
      {
        id: 3,
        act: "Act I: Foundations",
        speaker: "V. Ram Charan",
        title: "Computer-System Architecture",
        subtitle: "Evolution: Single-Processor, Multiprocessor, and Multicore Systems",
        render: () => `

      document.getElementById("noteConcept").textContent = slide.concept;
      document.getElementById("noteTransition").textContent = slide.transition;
      document.getElementById("noteCue").textContent = "Cue: " + slide.cue;

      // Update Grid thumbnails active state
      document.querySelectorAll(".thumb-card").forEach((card, i) => {
        card.classList.toggle("active", i === idx);
      });

      // Reset slide timer
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById("slideTimer").textContent = `${mins}:${secs}`;
    }

    function buildOverviewGrid() {
      const grid = document.getElementById("overviewGrid");
      grid.innerHTML = "";
      slidesData.forEach((s, i) => {
        const card = document.createElement("div");
        card.className = `thumb-card ${i === currentSlideIdx ? 'active' : ''}`;
        card.innerHTML = `
          <div class="thumb-num">${String(s.id).padStart(2, '0')}</div>
          <div class="thumb-title">${s.title}</div>
          <div class="thumb-speaker">${s.speaker}</div>

          document.getElementById("overviewModal").classList.remove("open");

        grid.appendChild(card);

    document.getElementById("prevBtn").onclick = () => {
      if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1);

      } else {

        if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1);

        renderSlide(0);
