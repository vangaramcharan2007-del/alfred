<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer System Architecture — Luxury Tech Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-carbon: #12141c;
      --bg-darker: #0c0d14;
      --card-bg: rgba(26, 30, 42, 0.85);
      --card-highlight: rgba(38, 45, 64, 0.9);
      --card-border: #2e364a;
      --card-hover-border: #38bdf8;
      --text-white: #ffffff;
      --text-muted: #a0afc8;
      --text-dim: #6e7d96;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #34d399;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --pill-bg: #1e2434;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-darker);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Ambient Background Light Sweep */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(129, 140, 248, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
      animation: ambientShift 12s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* Top Control Bar */
    header.control-bar {
      position: relative;
      z-index: 100;
      height: 54px;
      background: rgba(18, 20, 28, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .brand span {
      color: var(--text-white);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.2);
    }

    .btn-active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .timer-badge {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
    }

    /* Main Presentation Stage */
    main.stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 10;
    }

    .slide-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background-color: var(--bg-carbon);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.85), 0 0 40px rgba(56, 189, 248, 0.08);
      display: flex;
      flex-direction: column;
      padding: 2.2rem 2.8rem;
      overflow: hidden;
    }

    .slide-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }

    /* Slide Header */
    .slide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pill {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 0.3rem 0.85rem;
      border-radius: 9999px;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
    }

    .pill-act {
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .pill-speaker {
      color: var(--accent-indigo);
      border-color: rgba(129, 140, 248, 0.4);
      background: rgba(129, 140, 248, 0.1);
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--pill-bg);
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .slide-titles {
      margin-bottom: 1.25rem;
    }

    .slide-titles h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .slide-titles p {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-top: 0.2rem;
    }

    /* Slide Content Grid Layouts */
    .slide-body {
      flex: 1;
      display: grid;
      gap: 1.25rem;
      align-items: stretch;
    }

    .grid-2-col {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3-col {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-split-img {
      grid-template-columns: 1.15fr 1fr;
    }

    /* Minimalist Glass Card Component with Corner Tick */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: cardSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
    }

    .card::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      border-right: 2px solid rgba(255, 255, 255, 0.2);
    }

    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-cyan);
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .card-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .card-list li {
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-muted);
      position: relative;
      padding-left: 1.1rem;
    }

    .card-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 1.1rem;
    }

    .card-list li strong {
      color: var(--text-white);
      font-weight: 600;
    }

    /* 3D Illustration Containers */
    .diagram-container {
      background: rgba(14, 16, 24, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .diagram-container::before {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .diagram-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    .diagram-img:hover {
      transform: scale(1.03);
    }

    /* Circular Step Node Components */
    .step-circle-node {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--pill-bg);
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-white);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .step-circle-node.active-node {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    /* Bottom Full-Width Banner */
    .bottom-banner {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }

    .banner-tag {
      font-family: var(--font-heading);
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .banner-text {
      color: var(--text-white);
    }

    /* Presenter Notes Drawer */
    .notes-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 20, 28, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--accent-cyan);
      padding: 1.25rem 2rem;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 35vh;
      overflow-y: auto;
      box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.6);
    }

    .notes-drawer.open {
      transform: translateY(0);
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .notes-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1.25rem;
    }

    .note-block {
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }

    .note-block h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-indigo);
      margin-bottom: 0.35rem;
    }

    .note-block p {
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text-white);
    }

    /* Keyframe Animations */
    .fade-in {
      animation: slideMorph 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideMorph {
      from { opacity: 0; transform: scale(0.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Top Control Bar -->
  <header class="control-bar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M10 4v4"/><path d="M14 4v4"/><path d="M4 10h16"/><path d="M10 14h4"/></svg>
      <span>COMPUTER SYSTEM ARCHITECTURE</span> / LUXURY TECH PRESENTATION
    </div>

    <div class="nav-actions">
      <div class="timer-badge" id="slideTimer" title="Current slide rehearsal timer">00:00</div>
      <button class="btn" id="prevBtn" title="Previous Slide (Left Arrow)">◀ Prev</button>
      <button class="btn" id="nextBtn" title="Next Slide (Right Arrow / Space)">Next ▶</button>
      <button class="btn" id="notesBtn" title="Toggle Presenter Notes (N)">📝 Notes</button>
      <button class="btn" id="fullscreenBtn" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- Slide Presentation Stage -->
  <main class="stage">
    <div class="slide-wrapper fade-in" id="slideContainer">

    </div>
  </main>

  <!-- Presenter Notes Drawer -->
  <div class="notes-drawer" id="notesDrawer">
    <div class="notes-header">
      <div class="notes-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        PRESENTER SCRIPT — <span id="notesSpeaker">V. RAM CHARAN</span>
      </div>
      <button class="btn" id="closeNotesBtn">✕ Close</button>
    </div>
    <div class="notes-grid">
      <div class="note-block">
        <h4>1. What to Say (Spoken Script)</h4>
        <p id="noteSpeech">Script text here...</p>
      </div>
      <div class="note-block">
        <h4>2. Key Architectural Concept</h4>
        <p id="noteConcept">Core concept...</p>
      </div>
      <div class="note-block">
        <h4>3. Transition & Cue</h4>
        <p id="noteTransition">Transition...</p>
        <p style="margin-top: 0.35rem; color: var(--accent-amber);" id="noteCue">Cue...</p>
      </div>
    </div>
  </div>

  <script>
    const slidesData = [
      {
        id: 1,
        act: "Act I: Foundations",
        speaker: "V. Ram Charan",
        title: "Computer System Architecture",
        subtitle: "Understanding the Hardware Foundation of Operating Systems",
        render: () => `
          <div style="flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 2rem; align-items: center;">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <h1 style="font-size: 2.8rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.5px;">Computer System Architecture</h1>
              <p style="font-size: 1.2rem; color: var(--accent-cyan); font-weight: 600;">Understanding the Hardware Foundation of Operating Systems</p>
              <p style="font-size: 0.9rem; color: var(--text-dim);">Operating Systems — System Architecture & Execution Foundations</p>
              
              <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 1rem; background: var(--pill-bg); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--card-border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(56, 189, 248, 0.2); display: flex; align-items: center; justify-content: center; color: var(--accent-cyan); font-weight: bold;">RC</div>
                  <div>
                    <div style="font-weight: 700; color: #fff;">V. Ram Charan</div>
                    <div style="font-size: 0.75rem; color: var(--accent-cyan);">Speaker 1 (Act I Lead)</div>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem; background: var(--pill-bg); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--card-border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(129, 140, 248, 0.2); display: flex; align-items: center; justify-content: center; color: var(--accent-indigo); font-weight: bold;">VD</div>
                  <div>
                    <div style="font-weight: 700; color: #fff;">Vedhanth</div>
                    <div style="font-size: 0.75rem; color: var(--accent-indigo);">Speaker 2 (Act II Lead)</div>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem; background: var(--pill-bg); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--card-border);">
                  <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(52, 211, 153, 0.2); display: flex; align-items: center; justify-content: center; color: var(--accent-emerald); font-weight: bold;">LC</div>
                  <div>
                    <div style="font-weight: 700; color: #fff;">Lochan</div>
                    <div style="font-size: 0.75rem; color: var(--accent-emerald);">Speaker 3 (Act III Lead)</div>
                  </div>
                </div>
              </div>

              <div style="border-left: 3px solid var(--accent-cyan); padding-left: 1rem; margin-top: 0.5rem;">
                <p style="font-size: 0.95rem; font-style: italic; color: var(--text-muted);">"The operating system is the software most intimately involved with computer hardware."</p>
              </div>
            </div>
            <div class="diagram-container">
              <img src="assets/presentation/gamma_assets/iso_motherboard.png" class="diagram-img" alt="Isometric Motherboard">
            </div>
          </div>
        `,
        speech: "Good morning everyone. Welcome to our presentation on Computer System Architecture. I am Ram Charan, and together with Vedhanth and Lochan, we will walk you through the fundamental relationship between computer hardware and the operating system. The OS is the critical piece of software that transforms raw silicon, memory, and devices into a cohesive, secure platform.",
        concept: "The Operating System acts as the vital bridge between user software and physical hardware, balancing resource allocation and execution control.",
        transition: "Let us begin with Slide 2 by looking at the four fundamental components that make up any computer system.",
        cue: "Stand center, introduce team members, gesture to the presenter cards."
      },
      {
        id: 2,
        act: "Act I: Foundations",
        speaker: "V. Ram Charan",
        title: "What is a Computer System?",
        subtitle: "Four Major Components & The Role of the Operating System",
        render: () => `
          <div class="slide-body" style="grid-template-rows: 1.2fr 1fr; gap: 1rem;">
            <div class="grid-split-img" style="display: grid; gap: 1.25rem;">
              <div class="diagram-container">
                <img src="assets/presentation/gamma_assets/iso_stacked_layers.png" class="diagram-img" alt="Stacked Architecture">
              </div>
              <div class="card">
                <div class="card-title">Four Major Components</div>
                <div style="display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.25rem;">
                  <div><strong style="color: var(--accent-cyan);">→ User:</strong> <span style="color: var(--text-muted); font-size: 0.85rem;">Interacts with application programs</span></div>
                  <div><strong style="color: var(--accent-indigo);">→ Application Programs:</strong> <span style="color: var(--text-muted); font-size: 0.85rem;">Solve user computing problems (compilers, DBMS, browsers)</span></div>
                  <div><strong style="color: var(--accent-emerald);">→ Operating System:</strong> <span style="color: var(--text-muted); font-size: 0.85rem;">Controls and coordinates hardware use among competing applications</span></div>
                  <div><strong style="color: var(--accent-amber);">→ Computer Hardware:</strong> <span style="color: var(--text-muted); font-size: 0.85rem;">CPU, Main Memory, and I/O Devices providing raw computing resources</span></div>
                </div>
              </div>
            </div>
            <div class="grid-3-col" style="display: grid; gap: 1rem;">
              <div class="card">
                <div class="card-accent-bar"></div>
                <div class="card-title">Resource Allocator</div>
                <p class="card-text">Manages CPU time, memory space, storage, and I/O devices fairly and efficiently.</p>
              </div>
              <div class="card">
                <div class="card-accent-bar" style="background: var(--accent-emerald);"></div>
                <div class="card-title" style="color: var(--accent-emerald);">Control Program</div>
                <p class="card-text">Prevents errors and improper use of the computer by monitoring execution.</p>
              </div>
              <div class="card">
                <div class="card-accent-bar" style="background: var(--accent-indigo);"></div>
                <div class="card-title" style="color: var(--accent-indigo);">Hardware Manager</div>
                <p class="card-text">Coordinates hardware among all running applications to maximize throughput.</p>
              </div>
            </div>
          </div>
        `,
        speech: "A computer system is divided into four components: Users, Application Programs, the Operating System, and Computer Hardware. Hardware supplies raw computing resources—the CPU, main memory, and I/O devices. Sitting right between applications and hardware is the Operating System, which fulfills two vital roles: as a Resource Allocator managing CPU cycles and memory without conflict, and as a Control Program preventing bugs and illegal operations from crashing the machine.",
        concept: "Four-component computer system model & OS duality as Resource Allocator and Control Program.",
        transition: "Now let's examine how computer system architectures have evolved from single-processor systems to modern multi-core chips.",
        cue: "Point to the vertical diagram showing the OS buffering applications from raw hardware."

        </div>
        ${slide.render()}
      `;

      document.getElementById("noteSpeech").textContent = slide.speech;
      document.getElementById("noteConcept").textContent = slide.concept;
      document.getElementById("noteTransition").textContent = slide.transition;
      document.getElementById("noteCue").textContent = "Cue: " + slide.cue;

      resetTimer();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById("slideTimer").textContent = `${mins}:${secs}`;
    }

    document.getElementById("prevBtn").onclick = () => {
      if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1);
    };

      if (currentSlideIdx < slidesData.length - 1) renderSlide(currentSlideIdx + 1);
    };

    document.getElementById("notesBtn").onclick = () => {
      const drawer = document.getElementById("notesDrawer");
      drawer.classList.toggle("open");
      document.getElementById("notesBtn").classList.toggle("btn-active", drawer.classList.contains("open"));
    };

    document.getElementById("closeNotesBtn").onclick = () => {
      document.getElementById("notesDrawer").classList.remove("open");
      document.getElementById("notesBtn").classList.remove("btn-active");

        document.documentElement.requestFullscreen();
      } else {

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        if (currentSlideIdx < slidesData.length - 1) renderSlide(currentSlideIdx + 1);

        if (currentSlideIdx > 0) renderSlide(currentSlideIdx - 1);

        document.getElementById("fullscreenBtn").click();
      } else if (e.key === "Escape") {
