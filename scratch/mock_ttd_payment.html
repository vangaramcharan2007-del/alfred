<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTD Devasthanams - Payment Gateway</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; }
        .header { background-color: #800000; color: white; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #800000; }
        .ticket-info { background: #fff3f3; padding: 15px; border-left: 4px solid #800000; margin-bottom: 20px; }
        .ticket-info p { margin: 5px 0; font-weight: bold; }
        .qr-code { text-align: center; margin: 30px 0; }
        .qr-code img { border: 2px solid #ccc; padding: 10px; border-radius: 4px; }
        .btn { display: block; width: 100%; background: #4CAF50; color: white; border: none; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #45a049; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Tirumala Tirupati Devasthanams</h1>
        <p>Official Booking Portal</p>
    </div>

    <div class="container">
        <h2>Secure Payment Gateway</h2>
        
        <div class="ticket-info">
            <p>Service: Special Entry Darshan (Break Darshan)</p>
            <p>Date: December 2026</p>
            <p>Tickets: 4 Persons</p>
            <p>Total Amount: ₹1200.00</p>
        </div>

        <div class="qr-code">
            <p>Scan this QR code with any UPI app to complete your payment.</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=UPI://pay?pa=ttd@sbi&pn=TTD&am=1200.00&cu=INR" alt="UPI QR Code">
        </div>

        <button class="btn" onclick="alert('Payment Successful! Your tickets have been booked.')">I have completed the payment</button>
    </div>

</body>
</html>
