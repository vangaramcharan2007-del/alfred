name: AEGIS CI/CD — SIH 2026

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1-mesa-glx libglib2.0-0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install gTTS SpeechRecognition joblib

      - name: Run Tests with Coverage
        run: |
          pytest tests/test_aegis_sih.py -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check aegis_*.py sih_evaluator.py --select E,F,W --ignore E501

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t aegis-backend .
      - name: Build Frontend Image
        run: docker build -t aegis-ui ./aegis-ui
      - name: Verify Docker Compose
        run: docker compose config
