<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS X - Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.5;
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            z-index: 5;
            opacity: 0.6;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .status {
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(0, 240, 255, 0.8);
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00f0ff;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.5; box-shadow: 0 0 4px #00f0ff; }
            50% { opacity: 1; box-shadow: 0 0 12px #00f0ff; }
            100% { opacity: 0.5; box-shadow: 0 0 4px #00f0ff; }
        }

        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 60%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="header">
        <div class="title">FRIDAY</div>
        <div class="status"><span class="status-dot"></span>ONLINE | OMNIROUTE CONNECTED</div>
    </div>
    
    <canvas id="waveform"></canvas>

    <script>
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');
        
        let audioCtx;
        let analyser;
        let dataArray;
        let isMicActive = false;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.6;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let time = 0;

        function draw() {
            requestAnimationFrame(draw);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f0ff';
            
            ctx.beginPath();
            
            const sliceWidth = canvas.width / 200;
            let x = 0;
            
            if (isMicActive && dataArray) {
                analyser.getByteTimeDomainData(dataArray);
                
                for (let i = 0; i < 200; i++) {
                    const dataIndex = Math.floor(i * (dataArray.length / 200));
                    const v = dataArray[dataIndex] / 128.0;
                    
                    const envelope = Math.sin((i / 200) * Math.PI);
                    
                    const y = (v * (canvas.height / 2) * envelope) + (canvas.height / 2 * (1 - envelope));
                    
                    if (i === 0) {
                        ctx.moveTo(x, canvas.height / 2);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
            } else {
                for (let i = 0; i < 200; i++) {
                    const envelope = Math.sin((i / 200) * Math.PI);
                    const breathingAmplitude = Math.sin(time * 0.05) * 20 + 20;
                    const ripple = Math.sin((i * 0.1) + (time * 0.2)) * 10;
                    const y = canvas.height / 2 + (Math.sin((i * 0.05) - (time * 0.1)) * breathingAmplitude + ripple) * envelope;
                    
                    if (i === 0) {
                        ctx.moveTo(x, canvas.height / 2);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                time++;
            }
            
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            
            ctx.lineWidth = 1;
            ctx.shadowBlur = 5;
            ctx.beginPath();
            x = 0;
            
            if (!isMicActive) {
                 for (let i = 0; i < 200; i++) {
                    const envelope = Math.sin((i / 200) * Math.PI);
                    const breathingAmplitude = Math.sin(time * 0.05 + Math.PI) * 15 + 15;
                    const ripple = Math.sin((i * 0.15) + (time * 0.15)) * 5;
                    const y = canvas.height / 2 + (Math.sin((i * 0.06) - (time * 0.12)) * breathingAmplitude + ripple) * envelope;
                    
                    if (i === 0) ctx.moveTo(x, canvas.height / 2);
                    else ctx.lineTo(x, y);
                    
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
        }
        
        draw();

        document.body.addEventListener('click', async () => {
            if (isMicActive) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                analyser.fftSize = 2048;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                isMicActive = true;
                
                document.querySelector('.status').innerHTML = '<span class="status-dot" style="background-color: #0f0; box-shadow: 0 0 8px #0f0;"></span>LISTENING | OMNIROUTE CONNECTED';
                document.querySelector('.status-dot').style.backgroundColor = '#0f0';
                document.querySelector('.status-dot').style.boxShadow = '0 0 8px #0f0';
            } catch (err) {
                console.error('Microphone access denied or error:', err);
            }
        });
    </script>
</body>
</html>
