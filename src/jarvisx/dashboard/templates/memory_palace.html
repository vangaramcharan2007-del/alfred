<!DOCTYPE html>
<html>
<head>
    <title>JARVIS Memory Palace</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background-color: #0a0a0c; color: #00ffff; font-family: 'Courier New', monospace; overflow: hidden; }
        #graph { width: 100vw; height: 100vh; }
        .overlay { position: absolute; top: 20px; left: 20px; text-transform: uppercase; font-weight: bold; font-size: 24px; text-shadow: 0 0 10px #00ffff; }
        .node { fill: #00ffff; stroke: #fff; stroke-width: 1.5px; filter: drop-shadow(0 0 5px #00ffff); }
        .link { stroke: rgba(0, 255, 255, 0.3); stroke-opacity: 0.6; }
        .label { font-size: 10px; fill: #aaa; pointer-events: none; }
    </style>
</head>
<body>
    <div class="overlay">JARVIS VECTOR RAG // MEMORY PALACE</div>
    <svg id="graph"></svg>
    <script>
        // Fetch memory and build graph
        fetch('/api/memory').then(res => res.json()).then(data => {
            const nodes = data.map((d, i) => ({ id: i, text: d.text.substring(0, 30) + "...", full: d.text }));
            const links = [];
            // Randomly link nodes to simulate vector connections
            for(let i=0; i<nodes.length; i++) {
                for(let j=i+1; j<nodes.length; j++) {
                    if (Math.random() > 0.6) {
                        links.push({ source: i, target: j, value: Math.random() });
                    }
                }
            }

            const width = window.innerWidth;
            const height = window.innerHeight;
            const svg = d3.select("#graph").attr("viewBox", [0, 0, width, height]);

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.append("g")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value) * 2);

            const node = svg.append("g")
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("class", "node")
                .attr("r", 8)
                .call(drag(simulation));

            node.append("title").text(d => d.full);

            const label = svg.append("g")
                .selectAll("text")
                .data(nodes)
                .join("text")
                .attr("class", "label")
                .text(d => d.text)
                .attr("dx", 12)
                .attr("dy", 4);

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("cx", d => d.x).attr("cy", d => d.y);
                label.attr("x", d => d.x).attr("y", d => d.y);
            });

            function drag(simulation) {
                function dragstarted(event) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    event.subject.fx = event.subject.x;
                    event.subject.fy = event.subject.y;
                }
                function dragged(event) {
                    event.subject.fx = event.x;
                    event.subject.fy = event.y;
                }
                function dragended(event) {
                    if (!event.active) simulation.alphaTarget(0);
                    event.subject.fx = null;
                    event.subject.fy = null;
                }
                return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
            }
        });
    </script>
</body>
</html>
