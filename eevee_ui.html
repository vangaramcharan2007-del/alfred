<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V. - Tactical UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                linear-gradient(rgba(20, 20, 30, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 20, 30, 0.4) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Top Navigation Bar */
        .top-bar {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255, 50, 50, 0.2);
            background: linear-gradient(90deg, rgba(255,0,0,0.05) 0%, transparent 100%);
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #ff3333;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
            display: flex;
            align-items: center;
        }

        .logo span {
            font-size: 0.8rem;
            color: #8892b0;
            margin-left: 15px;
            letter-spacing: 4px;
        }

        .system-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #00ccff;
            text-align: right;
        }

        /* Main Grid Layout */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px 40px;
            justify-content: space-between;
            align-items: center;
        }

        /* Left Panel - Notifications & Context */
        .left-panel {
            width: 300px;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .notification-card {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(0, 204, 255, 0.3);
            border-top: 3px solid #00ccff;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease-out;
        }
        
        .notification-card.red {
            border-color: rgba(255, 50, 50, 0.3);
            border-top: 3px solid #ff3333;
        }

        .card-title {
            font-size: 0.8rem;
            color: #8892b0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-content {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Center Panel - The Ring & Waveform */
        .center-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hologram-ring {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 50, 50, 0.4);
            animation: rotate 20s linear infinite;
        }

        .ring-inner {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px solid rgba(0, 204, 255, 0.3);
            border-left: 3px solid #00ccff;
            border-right: 3px solid #00ccff;
            animation: rotate 12s linear infinite reverse;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        }

        /* Audio Waveform */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 10;
        }

        .bar {
            width: 6px;
            background-color: #ff3333;
            border-radius: 3px;
            box-shadow: 0 0 10px #ff3333;
            animation: wave 1s infinite ease-in-out;
        }

        .bar:nth-child(1) { height: 20px; animation-delay: 0.0s; }
        .bar:nth-child(2) { height: 40px; animation-delay: 0.1s; }
        .bar:nth-child(3) { height: 70px; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 100px; animation-delay: 0.3s; background-color: #ff9933; box-shadow: 0 0 10px #ff9933;}
        .bar:nth-child(5) { height: 120px; animation-delay: 0.4s; background-color: #ff9933; box-shadow: 0 0 10px #ff9933;}
        .bar:nth-child(6) { height: 100px; animation-delay: 0.5s; background-color: #ff9933; box-shadow: 0 0 10px #ff9933;}
        .bar:nth-child(7) { height: 70px; animation-delay: 0.6s; }
        .bar:nth-child(8) { height: 40px; animation-delay: 0.7s; }
        .bar:nth-child(9) { height: 20px; animation-delay: 0.8s; }

        /* Input Box below ring */
        .input-box {
            position: absolute;
            bottom: -60px;
            width: 60%;
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(0, 204, 255, 0.4);
            border-radius: 20px;
            padding: 10px 20px;
            color: #00ccff;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.1);
        }

        /* Right Panel - ADHD E.X.E.C Tasks */
        .right-panel {
            width: 300px;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .task-list-header {
            font-size: 1rem;
            color: #ff9933;
            margin-bottom: 15px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 153, 51, 0.3);
            padding-bottom: 5px;
        }

        .task-item {
            background: rgba(255, 153, 51, 0.05);
            border: 1px solid rgba(255, 153, 51, 0.2);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            transition: all 0.3s;
        }
        
        .task-item:hover {
            background: rgba(255, 153, 51, 0.1);
            border-color: rgba(255, 153, 51, 0.5);
        }

        .task-num {
            color: #ff9933;
            font-weight: 700;
            margin-right: 15px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Animations */
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.7; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        @keyframes slideIn {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>
    
    <div class="top-bar">
        <div class="logo">E.V. <span>EXECUTIVE VISION</span></div>
        <div class="system-status">
            SYSTEMS: <span style="color: #fff;">4/4 ONLINE</span><br>
            <span style="color: #ff3333;">MIC: [ACTIVE]</span>
        </div>
    </div>

    <div class="main-container">
        
        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="notification-card red" id="subtitles">
                <div class="card-title">USER AUDIO INTERCEPT</div>
                <div class="card-content" id="stt-text">"I can't focus on this code right now..."</div>
            </div>
            
            <div class="notification-card" id="agent-response">
                <div class="card-title">E.V. RESPONSE</div>
                <div class="card-content" id="tts-text" style="color: #00ccff;">Processing audio...</div>
            </div>
        </div>

        <!-- CENTER PANEL (HOLOGRAPHIC RING) -->
        <div class="center-panel">
            <div class="hologram-ring">
                <div class="ring-outer"></div>
                <div class="ring-inner"></div>
                
                <!-- Center Red/Orange Waveform -->
                <div class="waveform" id="wave">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
            
            <div class="input-box">
                ASK E.V... <span style="animation: blink 1s infinite;">_</span>
            </div>
        </div>

        <!-- RIGHT PANEL (ADHD MICRO TASKS) -->
        <div class="right-panel">
            <div class="task-list-header">E.X.E.C. PROTOCOL // MICRO-STEPS</div>
            
            <div class="task-item">
                <div class="task-num">01</div>
                <div>Breathe. Just open the terminal.</div>
            </div>
            <div class="task-item" style="opacity: 0.5;">
                <div class="task-num">02</div>
                <div>Read the first error line.</div>
            </div>
            <div class="task-item" style="opacity: 0.5;">
                <div class="task-num">03</div>
                <div>Send it to the Coder Swarm.</div>
            </div>
        </div>

    </div>

    <script>
        // Simulate E.V. Dialogue Loop
        const dialogue = [
            "That's okay! Take a deep breath.",
            "Let's just look at the first line of code.",
            "I'm right here with you.",
            "E.X.E.C. Protocol engaged.",
            "Dimming lights. You've got this."
        ];
        
        let i = 0;
        const ttsText = document.getElementById('tts-text');
        
        setInterval(() => {
            ttsText.innerText = dialogue[i];
            i = (i + 1) % dialogue.length;
        }, 3000);
        
        // Randomize waveform slightly to look alive
        const bars = document.querySelectorAll('.bar');
        setInterval(() => {
            bars.forEach(bar => {
                const height = parseInt(window.getComputedStyle(bar).height);
                bar.style.height = (height + (Math.random() * 20 - 10)) + 'px';
            });
        }, 500);
    </script>
</body>
</html>
