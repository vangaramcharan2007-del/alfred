<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V. - Tactical UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(rgba(20, 20, 30, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 20, 30, 0.4) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Top Navigation Bar */
        .top-bar {
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255, 50, 50, 0.2);
            background: linear-gradient(90deg, rgba(255,0,0,0.05) 0%, transparent 100%);
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #ff3333;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.8);
            display: flex;
            align-items: center;
        }

        .logo span {
            font-size: 0.8rem;
            color: #8892b0;
            margin-left: 15px;
            letter-spacing: 4px;
        }

        .system-status {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #00ccff;
            text-align: right;
            line-height: 1.6;
        }

        .system-status .stat-value {
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        /* Main Grid Layout */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px 40px;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Left Panel - Notifications & Context */
        .left-panel {
            width: 300px;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .notification-card {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(0, 204, 255, 0.3);
            border-top: 3px solid #00ccff;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease-out;
        }

        .notification-card.red {
            border-color: rgba(255, 50, 50, 0.3);
            border-top: 3px solid #ff3333;
        }

        .card-title {
            font-size: 0.8rem;
            color: #8892b0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-content {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Center Panel - The Ring & Waveform */
        .center-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hologram-ring {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 50, 50, 0.4);
            animation: rotate 20s linear infinite;
        }

        .ring-inner {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px solid rgba(0, 204, 255, 0.3);
            border-left: 3px solid #00ccff;
            border-right: 3px solid #00ccff;
            animation: rotate 12s linear infinite reverse;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.1);
        }

        /* Audio Waveform */
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 10;
        }

        .bar {
            width: 6px;
            background-color: #ff3333;
            border-radius: 3px;
            box-shadow: 0 0 10px #ff3333;
            animation: wave 1s infinite ease-in-out;
            transition: height 0.2s;
        }

        .bar:nth-child(1) { height: 20px; animation-delay: 0.0s; }
        .bar:nth-child(2) { height: 40px; animation-delay: 0.1s; }
        .bar:nth-child(3) { height: 70px; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 100px; animation-delay: 0.3s; background-color: #ff9933; box-shadow: 0 0 10px #ff9933;}
        .bar:nth-child(5) { height: 120px; animation-delay: 0.4s; background-color: #ff9933; box-shadow: 0 0 10px #ff9933;}
        .bar:nth-child(6) { height: 100px; animation-delay: 0.5s; background-color: #ff9933; box-shadow: 0 0 10px #ff9933;}
        .bar:nth-child(7) { height: 70px; animation-delay: 0.6s; }
        .bar:nth-child(8) { height: 40px; animation-delay: 0.7s; }
        .bar:nth-child(9) { height: 20px; animation-delay: 0.8s; }

        .waveform.idle .bar {
            animation-play-state: paused;
            height: 8px !important;
            opacity: 0.4;
        }

        .waveform.speaking .bar {
            animation-play-state: running;
        }

        /* Right Panel - ADHD E.X.E.C Tasks */
        .right-panel {
            width: 300px;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .task-list-header {
            font-size: 1rem;
            color: #ff9933;
            margin-bottom: 15px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 153, 51, 0.3);
            padding-bottom: 5px;
        }

        .task-item {
            background: rgba(255, 153, 51, 0.05);
            border: 1px solid rgba(255, 153, 51, 0.2);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: rgba(255, 153, 51, 0.1);
            border-color: rgba(255, 153, 51, 0.5);
        }

        .task-item.active {
            border-color: #ff9933;
            background: rgba(255, 153, 51, 0.15);
            box-shadow: 0 0 10px rgba(255, 153, 51, 0.2);
        }

        .task-num {
            color: #ff9933;
            font-weight: 700;
            margin-right: 15px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Notification Toast System */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 350px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid rgba(0, 204, 255, 0.4);
            border-left: 4px solid #00ccff;
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            animation: toastSlideIn 0.4s ease-out, toastFadeOut 0.5s ease-in 4.5s;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #ccd6f6;
        }

        .toast.warning {
            border-left-color: #ff9933;
        }

        .toast.danger {
            border-left-color: #ff3333;
        }

        .toast.success {
            border-left-color: #00ff88;
        }

        .toast-title {
            font-weight: 700;
            color: #00ccff;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        .toast.warning .toast-title { color: #ff9933; }
        .toast.danger .toast-title { color: #ff3333; }
        .toast.success .toast-title { color: #00ff88; }

        /* Animations */
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.7; }
            50% { transform: scaleY(1); opacity: 1; }
        }
        @keyframes slideIn {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes toastSlideIn {
            0% { transform: translateX(100px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes toastFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">E.V. <span>EXECUTIVE VISION</span></div>
        <div class="system-status">
            CPU: <span class="stat-value" id="cpu">--</span> | RAM: <span class="stat-value" id="ram">--</span><br>
            MODULES: <span class="stat-value" id="module-count">0</span>/14 | 
            <span id="connection-status" style="color: #ff3333;">DISCONNECTED</span>
        </div>
    </div>

    <div class="main-container">

        <!-- LEFT PANEL -->
        <div class="left-panel">
            <div class="notification-card red" id="subtitles">
                <div class="card-title">USER AUDIO INTERCEPT</div>
                <div class="card-content" id="stt-text">Waiting for mic input...</div>
            </div>

            <div class="notification-card" id="agent-response">
                <div class="card-title">E.V. RESPONSE</div>
                <div class="card-content" id="tts-text" style="color: #00ccff;">Standby.</div>
            </div>
        </div>

        <!-- CENTER PANEL (HOLOGRAPHIC RING) -->
        <div class="center-panel">
            <div class="hologram-ring">
                <div class="ring-outer"></div>
                <div class="ring-inner"></div>

                <!-- Center Red/Orange Waveform -->
                <div class="waveform idle" id="wave">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (ADHD MICRO TASKS) -->
        <div class="right-panel">
            <div class="task-list-header">E.X.E.C. PROTOCOL // MICRO-STEPS</div>
            <div id="task-list">
                <div class="task-item" style="opacity: 0.4;">
                    <div class="task-num">--</div>
                    <div>Waiting for E.X.E.C. to detect a task...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // DOM References
        const sttOutput = document.getElementById('stt-text');
        const ttsOutput = document.getElementById('tts-text');
        const cpuEl = document.getElementById('cpu');
        const ramEl = document.getElementById('ram');
        const moduleCountEl = document.getElementById('module-count');
        const connectionEl = document.getElementById('connection-status');
        const waveEl = document.getElementById('wave');
        const taskList = document.getElementById('task-list');
        const toastContainer = document.getElementById('toast-container');

        let moduleSet = new Set();
        let typingTimeout;

        // Typewriter effect for tts output
        function typeWriter(el, text, i, color) {
            el.style.color = color || "#00ccff";
            if (i === 0) el.innerHTML = "";
            if (i < text.length) {
                el.innerHTML = text.substring(0, i + 1);
                typingTimeout = setTimeout(() => typeWriter(el, text, i + 1, color), 30);
            }
        }

        // Toast notification system
        function showToast(title, message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type || ''}`;
            toast.innerHTML = `<div class="toast-title">${title}</div><div>${message}</div>`;
            toastContainer.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // Set waveform state
        function setWaveState(state) {
            waveEl.className = `waveform ${state}`; // 'idle', 'speaking'
        }

        // Update micro-steps panel
        function updateMicroSteps(steps) {
            taskList.innerHTML = '';
            steps.forEach((step, idx) => {
                const div = document.createElement('div');
                div.className = `task-item ${idx === 0 ? 'active' : ''}`;
                div.style.opacity = idx === 0 ? '1' : '0.5';
                div.innerHTML = `<div class="task-num">${String(idx + 1).padStart(2, '0')}</div><div>${step}</div>`;
                taskList.appendChild(div);
            });
        }

        // WebSocket Connection to Jarvis Kernel
        function connectWebSocket() {
            const ws = new WebSocket("ws://localhost:8765/ws");

            ws.onopen = function () {
                connectionEl.innerText = "UPLINKED";
                connectionEl.style.color = "#00ff88";
                showToast("UPLINK", "Connected to Jarvis X Kernel.", "success");
            };

            ws.onmessage = function (event) {
                try {
                    const msg = JSON.parse(event.data);

                    // ---- Live Telemetry ----
                    if (msg.type === "system_stats") {
                        cpuEl.innerText = msg.data.cpu_percent.toFixed(1) + "%";
                        ramEl.innerText = msg.data.ram_percent.toFixed(1) + "% (" + msg.data.ram_used_gb + "/" + msg.data.ram_total_gb + " GB)";
                    }

                    // ---- Module Boot Events ----
                    else if (msg.type === "module_boot") {
                        moduleSet.add(msg.data.name);
                        moduleCountEl.innerText = moduleSet.size;
                        showToast("MODULE ONLINE", msg.data.name + " → " + msg.data.status, "success");
                    }

                    // ---- STT Intercept (User Speech) ----
                    else if (msg.type === "stt_intercept") {
                        sttOutput.innerText = '"' + msg.data.text + '"';
                        setWaveState("speaking");
                        showToast("AUDIO INTERCEPT", msg.data.text, "");
                    }

                    // ---- TTS Response (Eevee Speaking) ----
                    else if (msg.type === "tts_response") {
                        clearTimeout(typingTimeout);
                        typeWriter(ttsOutput, msg.data.text, 0, "#00ccff");
                        setWaveState("speaking");
                    }
                    
                    // ---- Event Extensions ----
                    else if (msg.type === "finance_event") {
                        showToast("📈 " + msg.data.symbol + " ALERT: " + msg.data.price, "success");
                    } else if (msg.type === "devops_event") {
                        showToast("⚠️ DEV-OPS ALERT: " + msg.data.status, "danger");
                    } else if (msg.type === "email_event") {
                        showToast("✉️ GhostMail: " + msg.data.action, "success");
                    } else if (msg.type === "meeting_event") {
                        showToast("📅 Meeting Joiner: Opening " + msg.data.title, "warning");
                    } else if (msg.type === "debugger_event") {
                        showToast("🐞 DebuggerSwarm: " + msg.data.status, "success");
                    } else if (msg.type === "window_event") {
                        showToast("🖥️ WindowManager: " + msg.data.status, "");
                    } else if (msg.type === "security_event") {
                        showToast("🛡️ SentinelZero: " + msg.data.status, "danger");
                    } else if (msg.type === "research_event") {
                        showToast("🦉 Athena: " + msg.data.status, "info");
                    } else if (msg.type === "vision_event") {
                        showToast("🎨 DaVinci: " + msg.data.status, "success");
                    } else if (msg.type === "sentiment_event") {
                        showToast("📉 Midas: Market is " + msg.data.sentiment, "warning");
                    } else if (msg.type === "cyber_event") {
                        showToast("🛡️ CyberCommander: " + msg.data.status, "info");
                    } else if (msg.type === "memory_event") {
                        showToast("🧠 OpenVikings: " + msg.data.status, "info");
                    }

                    // ---- E.V. Status Updates ----
                    else if (msg.type === "ev_status") {
                        if (msg.data.text.includes("Standby") || msg.data.text.includes("Waiting")) {
                            setWaveState("idle");
                        }
                    }

                    // ---- E.X.E.C. Actions ----
                    else if (msg.type === "exec_action") {
                        const a = msg.data;
                        if (a.action === "flow_state_start") {
                            showToast("E.X.E.C. FLOW STATE", "Initiating for: " + a.project, "warning");
                        } else if (a.action === "process_killed") {
                            showToast("DISTRACTION KILLED", a.process + " terminated.", "danger");
                        } else if (a.action === "vscode_opened") {
                            showToast("VS CODE", "Opened: " + a.project, "success");
                        } else if (a.action === "flow_state_active") {
                            showToast("FLOW STATE ACTIVE", "Killed " + (a.killed ? a.killed.length : 0) + " distractions.", "success");
                        }
                    }

                    // ---- E.X.E.C. Micro-Steps ----
                    else if (msg.type === "exec_microsteps") {
                        updateMicroSteps(msg.data.steps);
                        showToast("MICRO-STEPS", "Task broken down: " + msg.data.task, "warning");
                    }

                    // ---- PreCog Events ----
                    else if (msg.type === "precog_event") {
                        showToast("PRE-COG", msg.data.context + " → " + msg.data.action, "warning");
                    }

                    // ---- Edith AR Vision Events ----
                    else if (msg.type === "edith_event") {
                        let text = msg.data.action;
                        if (msg.data.result) text += "<br><span style='color:#fff'>Result:</span> " + msg.data.result;
                        showToast("E.D.I.T.H. VISION", text, "warning");
                    }
                    
                    // ---- Ghost Browser Events ----
                    else if (msg.type === "ghost_event") {
                        let text = msg.data.action;
                        if (msg.data.text) text += "<br><span style='color:#fff'>Message:</span> " + msg.data.text;
                        showToast("GHOST PROTOCOL", text, "error");
                    }
                    
                    // ---- Finance Events ----
                    else if (msg.type === "finance_event") {
                        let text = `${msg.data.ticker} moved ${msg.data.change.toFixed(2)}%<br><span style='color:#fff'>Price: $${msg.data.price.toFixed(2)}</span>`;
                        let type = msg.data.change < 0 ? "error" : "success";
                        showToast("WALL STREET SWARM", text, type);
                    }
                    
                    // ---- DevOps Events ----
                    else if (msg.type === "devops_event") {
                        let text = `Runaway Process Detected:<br><span style='color:#fff'>${msg.data.process} @ ${msg.data.cpu}% CPU</span>`;
                        showToast("DEVOPS SENTRY", text, "warning");
                    }

                    // ---- Coder Swarm Events ----
                    else if (msg.type === "swarm_event") {
                        showToast("CODER SWARM [" + msg.data.agent + "]", msg.data.action, "success");
                        
                        // Also update the right panel dynamically
                        const taskList = document.getElementById('task-list');
                        const header = document.querySelector('.task-list-header');
                        if(header.innerText !== "THE TURING HIVE // CODER SWARM") {
                            header.innerText = "THE TURING HIVE // CODER SWARM";
                            header.style.color = "#00ff88";
                            header.style.borderBottomColor = "rgba(0, 255, 136, 0.3)";
                            taskList.innerHTML = ""; // clear
                        }
                        
                        const div = document.createElement('div');
                        div.className = "task-item active";
                        div.style.borderColor = "#00ff88";
                        div.style.background = "rgba(0, 255, 136, 0.1)";
                        div.innerHTML = `<div class="task-num" style="color:#00ff88">${msg.data.agent.substring(0,2).toUpperCase()}</div><div>${msg.data.action}</div>`;
                        taskList.prepend(div); // Add to top
                        
                        if (taskList.children.length > 5) {
                            taskList.removeChild(taskList.lastChild);
                        }
                    }

                } catch (e) {
                    console.error("WS Parse error", e);
                }
            };

            ws.onclose = function () {
                connectionEl.innerText = "DISCONNECTED";
                connectionEl.style.color = "#ff3333";
                setWaveState("idle");
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = function () {
                ws.close();
            };
        }

        // Start connection
        connectWebSocket();

        // Randomize waveform bar heights slightly for organic feel
        const bars = document.querySelectorAll('.bar');
        setInterval(() => {
            if (waveEl.classList.contains('speaking')) {
                bars.forEach(bar => {
                    const base = parseInt(window.getComputedStyle(bar).height);
                    bar.style.height = Math.max(10, base + (Math.random() * 30 - 15)) + 'px';
                });
            }
        }, 300);
    </script>
</body>
</html>
